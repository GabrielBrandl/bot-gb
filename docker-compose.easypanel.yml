# EasyPanel production stack (NO host ports, NO container_name).
# Prefer this ROOT path in EasyPanel so createDotEnv writes .env next to compose:
#   docker-compose.easypanel.yml
# (Also available: docker/docker-compose.easypanel.yml — but .env may not load there.)
#
# Domains/ports are assigned by EasyPanel. Services talk by service name.
# DB: Supabase (set DATABASE_URL + DIRECT_URL in EasyPanel env + createDotEnv).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evo.SEUDOMINIO.com}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # File/volume storage only — avoid empty DATABASE_CONNECTION_URI (P1012 crash)
      DATABASE_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI:-}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.SEUDOMINIO.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.SEUDOMINIO.com}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-https://api.SEUDOMINIO.com/api/whatsapp/webhook}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/api/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.SEUDOMINIO.com/api}
        VITE_WS_URL: ${VITE_WS_URL:-https://api.SEUDOMINIO.com}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  postgres:
    profiles: ["with-postgres"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bot_wpp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-evolution-db.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bot_wpp"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

volumes:
  redis_data:
  evolution_instances:
  postgres_data:

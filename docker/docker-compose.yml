# Local development stack — keeps host ports + container_name for convenience.
# EasyPanel production: use docker/docker-compose.easypanel.yml instead
# (no ports / no container_name — see docs/DEPLOY_EASYPANEL.md).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bot-wpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot_wpp
    # Host 5433 avoids conflict with Windows PostgreSQL on 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-evolution-db.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bot_wpp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bot-wpp-redis
    restart: unless-stopped
    # Host 6380 avoids conflict with Windows Redis on 6379
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: bot-wpp-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bot_wpp?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/bot_wpp?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      # Local compose: Evolution reaches API by service name.
      # EasyPanel: PUBLIC_API_URL=https://api.SEUDOMINIO.com
      #            EVOLUTION_WEBHOOK_URL=${PUBLIC_API_URL}/api/whatsapp/webhook
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_WEBHOOK_URL: http://api:3000/api/whatsapp/webhook
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: bot-wpp-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bot_wpp?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/bot_wpp?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVOLUTION_API_URL: http://evolution-api:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # EasyPanel: https://api.SEUDOMINIO.com/api  and  https://api.SEUDOMINIO.com
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:3000}
    container_name: bot-wpp-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # Official image: https://hub.docker.com/r/evoapicloud/evolution-api
  # EasyPanel: same image as a separate app; set SERVER_URL to public https://evo.…
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: bot-wpp-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN,INFO
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

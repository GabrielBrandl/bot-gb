# DEPRECATED for EasyPanel createDotEnv path.
# Use the ROOT file instead:
#   docker-compose.easypanel.yml
#
# This copy keeps the same stack with build context = parent folder
# if you insist on compose path docker/docker-compose.easypanel.yml
# (then place/copy .env into docker/ as well).
#
# Guia: docs/DEPLOY_EASYPANEL.md

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_wpp?schema=public}
  DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_wpp?schema=public}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  API_PORT: "3000"
  API_PREFIX: api
  CORS_ORIGIN: ${CORS_ORIGIN}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://bot-gb-evo.9nb5f0.easypanel.host}
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
  EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL}
  EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  RUN_SEED: ${RUN_SEED:-true}
  ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/api/v3}
  ASAAS_API_KEY: ${ASAAS_API_KEY:-}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bot_wpp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-evolution-db.sql:/docker-entrypoint-initdb.d/01-evolution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bot_wpp}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN,INFO
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    expose:
      - "8080"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    expose:
      - "3000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_wpp?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_wpp?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://bot-gb-evo.9nb5f0.easypanel.host}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(6379,'redis').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    expose:
      - "80"

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
